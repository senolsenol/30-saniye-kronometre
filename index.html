<!DOCTYPE html>
<html lang="tr">
<head>
    <head>
    <meta charset="UTF-8">

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#111111">

    <!-- Telefon ekranına uyum -->
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>30 Saniye Kronometre</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #111;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        .kronometre {
            width: 100%;
            max-width: 500px;

            text-align: center;
        }


        h1 {
            font-size: 26px;
            margin-bottom: 40px;
        }


        /* Ana süre */

        #sure {
            font-size: clamp(60px, 18vw, 100px);

            font-weight: bold;

            letter-spacing: 2px;

            white-space: nowrap;
        }


        /* Salise */

        #salise {
            font-size: clamp(28px, 8vw, 40px);

            color: #aaa;

            margin-top: 5px;
        }


        /* 25-30 sayacı */

        #sayac {
            height: 100px;

            margin-top: 25px;

            font-size: clamp(60px, 18vw, 90px);

            font-weight: bold;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        /* 30 saniye animasyonu */

        .otuzAnimasyon {

            animation: buyu 0.6s ease-in-out;

        }


        @keyframes buyu {

            0% {
                transform: scale(1);
            }

            40% {
                transform: scale(1.8);
            }

            70% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }

        }


        /* Butonlar */

        .butonlar {

            display: flex;

            gap: 10px;

            margin-top: 35px;
        }


        button {

            flex: 1;

            min-height: 60px;

            border: none;

            border-radius: 12px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            touch-action: manipulation;
        }


        button:active {

            transform: scale(0.96);

        }


        /* Telefon yatay tutulursa */

        @media (orientation: landscape) {

            body {
                padding: 10px;
            }

            h1 {
                margin-bottom: 10px;
            }

            #sayac {
                margin-top: 5px;
                height: 70px;
            }

            .butonlar {
                margin-top: 10px;
            }

        }

    </style>

</head>


<body>


<div class="kronometre">

    <h1>30 Saniye Kronometre</h1>


    <div id="sure">
        00:00
    </div>


    <div id="salise">
        .00
    </div>


    <div id="sayac"></div>


    <div class="butonlar">

        <button onclick="baslat()">
            Başlat
        </button>

        <button onclick="durdur()">
            Duraklat
        </button>

        <button onclick="sifirla()">
            Sıfırla
        </button>

    </div>

</div>



<script>

    let baslangicZamani = null;

    let toplamSure = 0;

    let zamanlayici = null;

    let sonSaniye = 0;

    let wakeLock = null;

async function ekranAcikTut() {

    try {

        if ("wakeLock" in navigator) {

            wakeLock =
                await navigator.wakeLock.request("screen");

        }

    } catch (hata) {

        console.log(
            "Ekran açık tutma kullanılamadı:",
            hata
        );

    }

}

async function ekranAcikTutBirak() {

    if (wakeLock !== null) {

        await wakeLock.release();

        wakeLock = null;

    }

}

   function baslat() {

    if (zamanlayici !== null) {
        return;
    }

    ekranAcikTut();

    baslangicZamani =
        performance.now() - toplamSure;

    zamanlayici =
        requestAnimationFrame(guncelle);
}


 function durdur() {

    if (zamanlayici !== null) {

        toplamSure =
            performance.now() - baslangicZamani;

        cancelAnimationFrame(zamanlayici);

        zamanlayici = null;

        ekranAcikTutBirak();
    }
}


    function sifirla() {

        durdur();

        toplamSure = 0;

        sonSaniye = 0;


        document.getElementById("sure")
            .textContent = "00:00";


        document.getElementById("salise")
            .textContent = ".00";


        document.getElementById("sayac")
            .textContent = "";


        document.getElementById("sayac")
            .classList.remove("otuzAnimasyon");

    }



    function guncelle(zaman) {

        toplamSure =
            zaman - baslangicZamani;


        let toplamMilisaniye =
            Math.floor(toplamSure);


        let toplamSaniye =
            Math.floor(
                toplamMilisaniye / 1000
            );


        let dakika =
            Math.floor(
                toplamSaniye / 60
            );


        let saniye =
            toplamSaniye % 60;


        let salise =
            Math.floor(
                (toplamMilisaniye % 1000) / 10
            );



        /*
        Ana süre
        */

        document.getElementById("sure")
            .textContent =

            String(dakika).padStart(2, "0")

            + ":"

            + String(saniye).padStart(2, "0");



        /*
        Salise
        */

        document.getElementById("salise")
            .textContent =

            "."

            + String(salise).padStart(2, "0");



        /*
        Her yeni saniye
        */

        if (toplamSaniye !== sonSaniye) {

            sonSaniye =
                toplamSaniye;


            let periyot =
                toplamSaniye % 30;



            /*
            25-29 saniye
            */

            if (
                periyot >= 25 &&
                periyot <= 29
            ) {

                let sayac =
                    document.getElementById("sayac");


                sayac.textContent =
                    periyot;


                kisaSes();

            }



            /*
            30. saniye
            */

            if (
                periyot === 0 &&
                toplamSaniye > 0
            ) {

                let sayac =
                    document.getElementById("sayac");


                sayac.textContent =
                    "30";


                /*
                Animasyonu yeniden başlat
                */

                sayac.classList.remove(
                    "otuzAnimasyon"
                );


                void sayac.offsetWidth;


                sayac.classList.add(
                    "otuzAnimasyon"
                );


                /*
                Güçlü ses
                */

                gucluSes();

            }

        }



        if (zamanlayici !== null) {

            zamanlayici =
                requestAnimationFrame(
                    guncelle
                );

        }

    }



    /*
    Kısa bip
    */

    function kisaSes() {

        let ses =
            new AudioContext();


        let oscillator =
            ses.createOscillator();


        let gain =
            ses.createGain();


        oscillator.connect(gain);

        gain.connect(
            ses.destination
        );


        oscillator.frequency.value =
            800;


        gain.gain.value =
            0.2;


        oscillator.start();



        setTimeout(function() {

            oscillator.stop();

            ses.close();

        }, 100);

    }



    /*
    30. saniyedeki güçlü bip
    */

    function gucluSes() {

        let ses =
            new AudioContext();


        let oscillator =
            ses.createOscillator();


        let gain =
            ses.createGain();


        oscillator.connect(gain);

        gain.connect(
            ses.destination
        );


        oscillator.frequency.value =
            1000;


        gain.gain.value =
            0.5;


        oscillator.start();



        setTimeout(function() {

            oscillator.stop();

            ses.close();

        }, 500);

    }

</script>

<script>

    if ("serviceWorker" in navigator) {

        window.addEventListener("load", function() {

            navigator.serviceWorker.register(
                "./service-worker.js"
            );

        });

    }

</script>

</body>
</html>
